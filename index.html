<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wormspace.io</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { background: #070913; overflow: hidden; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #ui-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(16, 22, 46, 0.88), rgba(5, 7, 15, 0.97));
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  h1 {
    font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: 2px; margin-bottom: 8px;
    background: linear-gradient(90deg, #00f5d4, #00bbf9, #9b5de5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  p.sub { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; text-align: center; }
  .card {
    background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px; padding: 20px; width: 100%; max-width: 330px;
    display: flex; flex-direction: column; gap: 14px;
  }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #fff; font-size: 1rem; outline: none; text-align: center;
  }
  .colors { display: flex; justify-content: center; gap: 10px; }
  .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .color-dot.active { border-color: #fff; transform: scale(1.2); }
  button#play-btn {
    padding: 14px; border-radius: 10px; border: none; font-size: 1.1rem; font-weight: bold;
    background: linear-gradient(90deg, #00f5d4, #00bbf9); color: #050811; cursor: pointer;
  }
  #hud {
    position: fixed; top: 12px; left: 12px; pointer-events: none; z-index: 5;
    background: rgba(10, 15, 30, 0.7); padding: 8px 14px; border-radius: 10px; font-size: 0.9rem;
  }
  #leaderboard {
    position: fixed; top: 12px; right: 12px; pointer-events: none; z-index: 5;
    background: rgba(10, 15, 30, 0.7); padding: 10px 14px; border-radius: 10px; font-size: 0.8rem; min-width: 140px;
  }
  #leaderboard h3 { font-size: 0.8rem; color: #38bdf8; margin-bottom: 6px; }
  .lb-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
  #boost-btn {
    position: fixed; bottom: 24px; right: 24px; width: 68px; height: 68px; border-radius: 50%;
    background: rgba(0,245,212,0.25); border: 2px solid #00f5d4; color: #fff;
    font-weight: bold; font-size: 0.8rem; display: none; align-items: center; justify-content: center; z-index: 6;
  }
  #gameover-msg { color: #f87171; font-weight: bold; text-align: center; display: none; }
</style>
</head>
<body>
<div id="hud" style="display:none;">Massa: <strong id="score-val">10</strong></div>
<div id="leaderboard" style="display:none;"><h3>Top Espacial</h3><div id="lb-list"></div></div>
<div id="boost-btn">TURBO</div>
<div id="ui-overlay">
  <h1>WORMSPACE.IO</h1>
  <p class="sub">Colete energia cósmica e desvie das outras naves-minhoca!</p>
  <div class="card">
    <div id="gameover-msg">Você colidiu! Pontos: <span id="final-score">0</span></div>
    <input type="text" id="player-name" placeholder="Seu apelido" maxlength="14" value="Piloto">
    <div class="colors" id="color-picker"></div>
    <button id="play-btn">JOGAR AGORA</button>
  </div>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const playBtn = document.getElementById('play-btn');
const nameInput = document.getElementById('player-name');
const colorPicker = document.getElementById('color-picker');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('score-val');
const leaderboard = document.getElementById('leaderboard');
const lbList = document.getElementById('lb-list');
const boostBtn = document.getElementById('boost-btn');
const gameOverMsg = document.getElementById('gameover-msg');
const finalScoreSpan = document.getElementById('final-score');

const SKINS = ['#00f5d4', '#ff007f', '#fee440', '#9b5de5', '#00bbf9', '#fb5607'];
let selectedColor = SKINS[0];

SKINS.forEach((c, idx) => {
  const dot = document.createElement('div');
  dot.className = 'color-dot' + (idx === 0 ? ' active' : '');
  dot.style.background = c;
  dot.onclick = () => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    selectedColor = c;
  };
  colorPicker.appendChild(dot);
});

const WORLD_SIZE = 2800;
const INITIAL_LENGTH = 18;
const SEGMENT_DIST = 6;
const BOT_NAMES = ['Nebula', 'Vortex', 'Cometa', 'Orion', 'Supernova', 'Astra', 'Cosmo', 'Eclipse', 'Pulsar', 'Galáxia'];

let worms = [], foods = [], stars = [], player = null, targetAngle = 0, isBoosting = false, gameRunning = false;

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

for (let i = 0; i < 200; i++) {
  stars.push({ x: (Math.random() - 0.5) * WORLD_SIZE * 1.6, y: (Math.random() - 0.5) * WORLD_SIZE * 1.6, r: Math.random() * 1.8 + 0.4, alpha: Math.random() * 0.8 + 0.2 });
}

function spawnFood(x, y, value = 1, color = null) {
  foods.push({
    x: x !== undefined ? x : (Math.random() - 0.5) * WORLD_SIZE,
    y: y !== undefined ? y : (Math.random() - 0.5) * WORLD_SIZE,
    r: value > 1 ? 6 : 3.5, value,
    color: color || SKINS[Math.floor(Math.random() * SKINS.length)]
  });
}

class Worm {
  constructor(name, x, y, color, isBot = false) {
    this.name = name; this.color = color; this.isBot = isBot;
    this.angle = Math.random() * Math.PI * 2; this.speed = 3.2; this.radius = 10; this.score = 10;
    this.boosting = false; this.segments = [];
    for (let i = 0; i < INITIAL_LENGTH; i++) {
      this.segments.push({ x: x - Math.cos(this.angle) * i * SEGMENT_DIST, y: y - Math.sin(this.angle) * i * SEGMENT_DIST });
    }
    this.botTimer = 0; this.botTargetAngle = this.angle;
  }

  update() {
    if (this.isBot) {
      this.botTimer--;
      const head = this.segments[0];
      if (Math.hypot(head.x, head.y) > WORLD_SIZE * 0.46) {
        this.botTargetAngle = Math.atan2(-head.y, -head.x);
      } else if (this.botTimer <= 0) {
        this.botTimer = 25 + Math.random() * 45;
        let nearest = null, minDist = 300;
        for (let f of foods) {
          const d = Math.hypot(f.x - head.x, f.y - head.y);
          if (d < minDist) { minDist = d; nearest = f; }
        }
        this.botTargetAngle = nearest ? Math.atan2(nearest.y - head.y, nearest.x - head.x) : this.angle + (Math.random() - 0.5) * 1.5;
      }
      let diff = this.botTargetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * 0.08;
    } else {
      let diff = targetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * 0.12;
      this.boosting = isBoosting && this.score > 12;
    }

    const currentSpeed = this.boosting ? 5.6 : this.speed;
    if (this.boosting && Math.random() < 0.25) {
      this.score = Math.max(10, this.score - 0.4);
      const tail = this.segments[this.segments.length - 1];
      spawnFood(tail.x, tail.y, 1, this.color);
    }

    const head = this.segments[0];
    const newHead = { x: head.x + Math.cos(this.angle) * currentSpeed, y: head.y + Math.sin(this.angle) * currentSpeed };
    if (Math.hypot(newHead.x, newHead.y) > WORLD_SIZE * 0.5) return false;

    this.segments.unshift(newHead);
    const desiredLen = Math.floor(INITIAL_LENGTH + this.score * 0.7);
    while (this.segments.length > desiredLen) this.segments.pop();

    for (let i = 1; i < this.segments.length; i++) {
      const prev = this.segments[i - 1], curr = this.segments[i];
      const dx = prev.x - curr.x, dy = prev.y - curr.y, dist = Math.hypot(dx, dy);
      if (dist > SEGMENT_DIST) {
        const a = Math.atan2(dy, dx);
        curr.x = prev.x - Math.cos(a) * SEGMENT_DIST;
        curr.y = prev.y - Math.sin(a) * SEGMENT_DIST;
      }
    }

    this.radius = Math.min(24, 10 + this.score * 0.025);
    for (let i = foods.length - 1; i >= 0; i--) {
      const f = foods[i];
      if (Math.hypot(newHead.x - f.x, newHead.y - f.y) < this.radius + f.r + 4) {
        this.score += f.value;
        foods.splice(i, 1);
      }
    }
    return true;
  }

  draw(camX, camY) {
    for (let i = this.segments.length - 1; i >= 0; i--) {
      const seg = this.segments[i];
      const sx = seg.x - camX + canvas.width / 2, sy = seg.y - camY + canvas.height / 2;
      if (sx < -40 || sx > canvas.width + 40 || sy < -40 || sy > canvas.height + 40) continue;
      ctx.beginPath();
      ctx.arc(sx, sy, this.radius * (i === 0 ? 1.08 : 0.95), 0, Math.PI * 2);
      ctx.fillStyle = i % 3 === 0 ? '#ffffff33' : this.color;
      ctx.fill();
      if (i === 0) {
        ctx.fillStyle = this.color; ctx.fill();
        [-1, 1].forEach(side => {
          const ex = sx + Math.cos(this.angle + 0.55 * side) * (this.radius * 0.45);
          const ey = sy + Math.sin(this.angle + 0.55 * side) * (this.radius * 0.45);
          ctx.beginPath(); ctx.arc(ex, ey, this.radius * 0.26, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
          ctx.beginPath(); ctx.arc(ex + Math.cos(this.angle)*1.5, ey + Math.sin(this.angle)*1.5, this.radius * 0.13, 0, Math.PI * 2); ctx.fillStyle = '#050811'; ctx.fill();
        });
      }
    }
    const head = this.segments[0];
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
